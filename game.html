<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEE-AI PACKETMAN</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-wrapper {
            background: #0d0d0d;
            border: 1px solid #151515;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #888;
        }
        .score { color: #ffdf00; font-weight: bold; }
        
        .canvas-container {
            position: relative;
        }

        canvas {
            background: #000;
            border-radius: 4px;
            display: block;
        }

        .start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(2px);
        }
        .start-text {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-align: center;
            animation: retroBlink 1.5s infinite;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        @keyframes retroBlink {
            0% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
            20% { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
            40% { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
            60% { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
            80% { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        }

        .controls { 
            margin-top: 1rem; 
            color: #666; 
            font-size: 0.75rem; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .credits { color: #4E85BF; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <span>ZEE-AI_PACKETMAN.EXE</span>
            <span>SCORE: <span class="score" id="score">0</span></span>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="360"></canvas>
            <div class="start-overlay" id="startOverlay">
                <div class="start-text">CLICK TO START</div>
            </div>
        </div>

        <div class="controls">
            <div>Use Arrow Keys / WASD to move</div>
            <div class="credits">Design and developed by Zeeshan Saeed Paracha</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startOverlay = document.getElementById('startOverlay');

        const tileSize = 20;
        const map = [
            "####################",
            "#........#.........#",
            "#.##.###.#.###.##.#",
            "#o##.###.#.###.##o#",
            "#.................#",
            "#.##.#.#####.#.##.#",
            "#....#...#...#....#",
            "####.### # ###.####",
            "   #.#       #.#   ",
            "####.# ##-## #.####",
            "#......#   #......#",
            "#.##.#.#####.#.##.#",
            "#o.#...........#.o#",
            "##.#.#.#####.#.#.##",
            "#....#...#...#....#",
            "#.######.#.######.#",
            "#.................#",
            "####################"
        ];

        let grid = [];
        let score = 0;
        let isPlaying = false;
        let animationId;
        let frightTimer = 0;

        let pacman = { x: 9, y: 13, dx: 0, dy: 0, nextDx: 0, nextDy: 0, angle: 0, mouth: 0, mouthDir: 1 };
        
        const ghostSpawns = [
            { x: 9, y: 8, color: '#ff0000' }, // Red
            { x: 10, y: 8, color: '#ffb8ff' }, // Pink
            { x: 9, y: 7, color: '#00ffff' }  // Cyan
        ];

        // Ghost states: 0 = Normal, 1 = Frightened, 2 = Eaten (Dead)
        let ghosts = [];

        function resetGhosts() {
            ghosts = ghostSpawns.map(g => ({ 
                ...g, 
                dx: 0, 
                dy: 0, 
                state: 0, 
                respawnTimer: 0 
            }));
        }

        const words = ["GOOGLE", "KAGGLE", "AWS", "ML", "GCP", "DEV"];
        const wordColors = ["#4285F4", "#20BEFF", "#FF9900", "#FF00FF", "#00FF00", "#FF5555"];
        let wordIndex = 0;

        function initGame() {
            grid = [];
            wordIndex = 0;
            score = 0;
            scoreEl.innerText = score;
            pacman.x = 9; pacman.y = 13; pacman.dx = 0; pacman.dy = 0; pacman.nextDx = 0; pacman.nextDy = 0;
            frightTimer = 0;
            resetGhosts();

            for (let r = 0; r < map.length; r++) {
                let row = [];
                for (let c = 0; c < map[r].length; c++) {
                    let char = map[r][c];
                    if (char === '#') row.push(1);
                    else if (char === '.') {
                        if (c % 6 === 0) {
                            row.push({ type: 2, word: words[wordIndex], color: wordColors[wordIndex], charIndex: 0 });
                            wordIndex = (wordIndex + 1) % words.length;
                        } else {
                            let prev = row[row.length - 1];
                            if (prev && typeof prev === 'object' && prev.type === 2 && prev.charIndex < prev.word.length - 1) {
                                row.push({ type: 2, word: prev.word, color: prev.color, charIndex: prev.charIndex + 1 });
                            } else {
                                row.push(2);
                            }
                        }
                    }
                    else if (char === 'o') row.push(3);
                    else row.push(0);
                }
                row.push(1);
                grid.push(row);
            }
        }

        // Init and draw static board BEFORE clicking start
        initGame();
        draw(); 

        startOverlay.addEventListener('click', () => {
            startOverlay.style.display = 'none';
            isPlaying = true;
            canvas.focus();
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        });

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowUp' || e.key === 'w') { pacman.nextDx = 0; pacman.nextDy = -1; pacman.angle = -Math.PI/2; }
            if (e.key === 'ArrowDown' || e.key === 's') { pacman.nextDx = 0; pacman.nextDy = 1; pacman.angle = Math.PI/2; }
            if (e.key === 'ArrowLeft' || e.key === 'a') { pacman.nextDx = -1; pacman.nextDy = 0; pacman.angle = Math.PI; }
            if (e.key === 'ArrowRight' || e.key === 'd') { pacman.nextDx = 1; pacman.nextDy = 0; pacman.angle = 0; }
        });

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Maze
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    let val = grid[r][c];
                    let x = c * tileSize;
                    let y = r * tileSize;
                    
                    if (val === 1) {
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.strokeStyle = '#333';
                        ctx.strokeRect(x, y, tileSize, tileSize);
                    } else if (val === 3) {
                        ctx.fillStyle = '#ffdf00';
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, 6, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (val && typeof val === 'object' && val.type === 2) {
                        ctx.fillStyle = val.color;
                        ctx.font = "bold 12px monospace";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        let letter = val.word[val.charIndex];
                        ctx.fillText(letter, x + tileSize/2, y + tileSize/2);
                    } else if (val === 2) {
                        ctx.fillStyle = '#666';
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Draw Pacman
            ctx.save();
            ctx.translate(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2);
            ctx.rotate(pacman.angle);
            ctx.fillStyle = '#ffdf00';
            ctx.beginPath();
            if(isPlaying) {
                pacman.mouth += 0.15 * pacman.mouthDir;
                if (pacman.mouth > 1 || pacman.mouth < 0) pacman.mouthDir *= -1;
            }
            let mouthAngle = pacman.mouth * 0.6;
            ctx.arc(0, 0, tileSize/2 - 1, mouthAngle, Math.PI * 2 - mouthAngle);
            ctx.lineTo(0, 0);
            ctx.fill();
            
            // Draw Pacman Eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, -6, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw Ghosts
            ghosts.forEach(g => {
                // If eaten, don't draw the body, just the eyes
                let drawBody = g.state !== 2; 

                ctx.save();
                ctx.translate(g.x * tileSize + tileSize/2, g.y * tileSize + tileSize/2);
                
                if (drawBody) {
                    if (g.state === 1) {
                        // Frightened blink effect
                        if (frightTimer < 120 && Math.floor(frightTimer / 15) % 2 === 0) {
                            ctx.fillStyle = '#fff';
                        } else {
                            ctx.fillStyle = '#0000ff';
                        }
                    } else {
                        ctx.fillStyle = g.color;
                    }

                    ctx.beginPath();
                    ctx.arc(0, -2, tileSize/2 - 2, Math.PI, 0);
                    ctx.lineTo(tileSize/2 - 2, tileSize/2 - 2);
                    for(let i=0; i<3; i++) {
                        ctx.lineTo(tileSize/2 - 2 - (i*4+2), tileSize/2 - 4);
                        ctx.lineTo(tileSize/2 - 2 - (i*4+4), tileSize/2 - 2);
                    }
                    ctx.lineTo(-(tileSize/2 - 2), tileSize/2 - 2);
                    ctx.fill();
                }
                
                // Draw Eyes
                ctx.fillStyle = (g.state === 1 && frightTimer > 120) ? '#ffb8ff' : '#fff';
                ctx.beginPath(); ctx.arc(-3, -2, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(3, -2, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-3, -2, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(3, -2, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });
        }

        function update() {
            if (!isPlaying) return;

            // 1. Handle Pacman Input/Turning
            if (pacman.nextDx !== 0 || pacman.nextDy !== 0) {
                if (Math.abs(pacman.x - Math.round(pacman.x)) < 0.2 && Math.abs(pacman.y - Math.round(pacman.y)) < 0.2) {
                    let turnX = Math.round(pacman.x) + pacman.nextDx;
                    let turnY = Math.round(pacman.y) + pacman.nextDy;
                    if (grid[turnY] && grid[turnY][turnX] !== 1) {
                        pacman.x = Math.round(pacman.x);
                        pacman.y = Math.round(pacman.y);
                        pacman.dx = pacman.nextDx;
                        pacman.dy = pacman.nextDy;
                        pacman.nextDx = 0; pacman.nextDy = 0;
                    }
                }
            }

            // 2. Move Pacman (with wall collision)
            let nextX = pacman.x + pacman.dx * 0.15;
            let nextY = pacman.y + pacman.dy * 0.15;
            let checkX = Math.round(nextX + (pacman.dx > 0 ? 0.4 : (pacman.dx < 0 ? -0.4 : 0)));
            let checkY = Math.round(nextY + (pacman.dy > 0 ? 0.4 : (pacman.dy < 0 ? -0.4 : 0)));

            if (grid[checkY] && grid[checkY][checkX] !== 1) {
                pacman.x = nextX;
                pacman.y = nextY;
            } else {
                if (pacman.dx !== 0) pacman.x = Math.round(pacman.x);
                if (pacman.dy !== 0) pacman.y = Math.round(pacman.y);
                pacman.dx = 0; pacman.dy = 0;
            }

            // 3. Eat Pellets
            let cx = Math.round(pacman.x);
            let cy = Math.round(pacman.y);
            if (grid[cy] && grid[cy][cx] !== 1 && grid[cy][cx] !== 0) {
                if (grid[cy][cx] === 2 || (grid[cy][cx] && grid[cy][cx].type === 2)) {
                    score += 10;
                } else if (grid[cy][cx] === 3) {
                    score += 50;
                    frightTimer = 360; // 6 seconds
                    ghosts.forEach(g => { if(g.state === 0) g.state = 1; });
                }
                grid[cy][cx] = 0;
                scoreEl.innerText = score;
            }

            if (frightTimer > 0) {
                frightTimer--;
                if (frightTimer === 0) {
                    ghosts.forEach(g => { if(g.state === 1) g.state = 0; });
                }
            }

            // 4. Ghost AI and Movement
            ghosts.forEach((g, index) => {
                // Handle Eaten Ghosts Respawn
                if (g.state === 2) {
                    g.respawnTimer--;
                    if (g.respawnTimer <= 0) {
                        g.state = 0;
                        g.x = ghostSpawns[index].x;
                        g.y = ghostSpawns[index].y;
                        g.dx = 0; g.dy = 0;
                    }
                    return; // Dead ghosts don't move
                }

                // If perfectly aligned with grid, make a new direction decision
                if (Math.abs(g.x - Math.round(g.x)) < 0.1 && Math.abs(g.y - Math.round(g.y)) < 0.1) {
                    g.x = Math.round(g.x); 
                    g.y = Math.round(g.y);
                    
                    let possible = [];
                    [[0,-1],[0,1],[-1,0],[1,0]].forEach(dir => {
                        if (grid[g.y+dir[1]] && grid[g.y+dir[1]][g.x+dir[0]] !== 1) {
                            possible.push(dir);
                        }
                    });

                    // Don't reverse direction unless it's the only option
                    let forward = possible.filter(d => !(d[0] === -g.dx && d[1] === -g.dy));
                    if (forward.length > 0) possible = forward;
                    
                    // If frightened, pick a random path
                    if (g.state === 1) {
                        if (possible.length > 0) {
                            let dir = possible[Math.floor(Math.random() * possible.length)];
                            g.dx = dir[0]; 
                            g.dy = dir[1];
                        }
                    } else {
                        // Normal: 50% chance to chase, 50% chance to wander randomly
                        if (Math.random() < 0.5 && possible.length > 0) {
                             possible.sort((a, b) => {
                                let distA = Math.hypot((g.x + a[0]) - pacman.x, (g.y + a[1]) - pacman.y);
                                let distB = Math.hypot((g.x + b[0]) - pacman.x, (g.y + b[1]) - pacman.y);
                                return distA - distB; // Shortest distance first
                            });
                            g.dx = possible[0][0]; 
                            g.dy = possible[0][1];
                        } else if (possible.length > 0) {
                            let dir = possible[Math.floor(Math.random() * possible.length)];
                            g.dx = dir[0]; 
                            g.dy = dir[1];
                        }
                    }
                }

                // Move ghost
                let speed = g.state === 1 ? 0.05 : 0.1;
                g.x += g.dx * speed;
                g.y += g.dy * speed;

                // Check collision with Pacman
                let dist = Math.hypot(g.x - pacman.x, g.y - pacman.y);
                if (dist < 0.6) {
                    if (g.state === 1) {
                        // Eat ghost
                        score += 200;
                        scoreEl.innerText = score;
                        g.state = 2; // Mark as eaten
                        g.respawnTimer = 180; // 3 seconds
                        g.dx = 0; g.dy = 0;
                    } else if (g.state === 0) {
                        // Pacman dies -> reset position
                        pacman.x = 9;
                        pacman.y = 13;
                        pacman.dx = 0; pacman.dy = 0;
                        pacman.nextDx = 0; pacman.nextDy = 0;
                    }
                }
            });
        }

        function gameLoop() {
            update();
            draw();
            if (isPlaying) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
