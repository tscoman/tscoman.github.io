<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pac-Man Test</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-wrapper {
            background: #0d0d0d;
            border: 1px solid #151515;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #888;
        }
        .score { color: #ffdf00; font-weight: bold; }
        canvas {
            background: #000;
            border-radius: 4px;
            display: block;
        }
        .controls { margin-top: 1rem; color: #666; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <span>AI_PACMAN.EXE</span>
            <span>SCORE: <span class="score" id="score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="360" tabindex="1"></canvas>
        <div class="controls">Click the game & Use Arrow Keys / WASD to move</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const tileSize = 20;
        // 20x18 grid
        const map = [
            "####################",
            "#........#.........#",
            "#.##.###.#.###.##.#",
            "#o##.###.#.###.##o#",
            "#.................#",
            "#.##.#.#####.#.##.#",
            "#....#...#...#....#",
            "####.### # ###.####",
            "   #.#       #.#   ",
            "####.# ##-## #.####",
            "#......#   #......#",
            "#.##.#.#####.#.##.#",
            "#o.#...........#.o#",
            "##.#.#.#####.#.#.##",
            "#....#...#...#....#",
            "#.######.#.######.#",
            "#.................#",
            "####################"
        ];

        let grid = [];
        let score = 0;
        let pacman = { x: 9, y: 13, dx: 0, dy: 0, nextDx: 0, nextDy: 0, angle: 0, mouth: 0, mouthDir: 1 };
        let ghosts = [
            { x: 9, y: 8, dx: 0, dy: 0, color: '#ff0000' },
            { x: 10, y: 8, dx: 0, dy: 0, color: '#ffb8ff' },
            { x: 9, y: 7, dx: 0, dy: 0, color: '#00ffff' }
        ];

        // Parse map
        for (let r = 0; r < map.length; r++) {
            let row = [];
            for (let c = 0; c < map[r].length; c++) {
                let char = map[r][c];
                if (char === '#') row.push(1);
                else if (char === '.') row.push(2);
                else if (char === 'o') row.push(3);
                else row.push(0);
            }
            row.push(1); // Right wall
            grid.push(row);
        }

        // Input Handler
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowUp' || e.key === 'w') { pacman.nextDx = 0; pacman.nextDy = -1; pacman.angle = -Math.PI/2; }
            if (e.key === 'ArrowDown' || e.key === 's') { pacman.nextDx = 0; pacman.nextDy = 1; pacman.angle = Math.PI/2; }
            if (e.key === 'ArrowLeft' || e.key === 'a') { pacman.nextDx = -1; pacman.nextDy = 0; pacman.angle = Math.PI; }
            if (e.key === 'ArrowRight' || e.key === 'd') { pacman.nextDx = 1; pacman.nextDy = 0; pacman.angle = 0; }
        });

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Map
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    let val = grid[r][c];
                    let x = c * tileSize;
                    let y = r * tileSize;
                    
                    if (val === 1) {
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.strokeStyle = '#333';
                        ctx.strokeRect(x, y, tileSize, tileSize);
                    } else if (val === 2) {
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (val === 3) {
                        ctx.fillStyle = '#ffdf00';
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Draw Pacman
            ctx.save();
            ctx.translate(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2);
            ctx.rotate(pacman.angle);
            ctx.fillStyle = '#ffdf00';
            ctx.beginPath();
            pacman.mouth += 0.15 * pacman.mouthDir;
            if (pacman.mouth > 1 || pacman.mouth < 0) pacman.mouthDir *= -1;
            let mouthAngle = pacman.mouth * 0.6;
            ctx.arc(0, 0, tileSize/2 - 1, mouthAngle, Math.PI * 2 - mouthAngle);
            ctx.lineTo(0, 0);
            ctx.fill();
            ctx.restore();

            // Draw Ghosts
            ghosts.forEach(g => {
                ctx.save();
                ctx.translate(g.x * tileSize + tileSize/2, g.y * tileSize + tileSize/2);
                ctx.fillStyle = g.color;
                ctx.beginPath();
                ctx.arc(0, -2, tileSize/2 - 2, Math.PI, 0);
                ctx.lineTo(tileSize/2 - 2, tileSize/2 - 2);
                for(let i=0; i<3; i++) {
                    ctx.lineTo(tileSize/2 - 2 - (i*4+2), tileSize/2 - 4);
                    ctx.lineTo(tileSize/2 - 2 - (i*4+4), tileSize/2 - 2);
                }
                ctx.lineTo(-(tileSize/2 - 2), tileSize/2 - 2);
                ctx.fill();
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-3, -2, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(3, -2, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-3, -2, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(3, -2, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });
        }

        function update() {
            // Handle Input Buffer
            if (pacman.nextDx !== 0 || pacman.nextDy !== 0) {
                let nextX = Math.round(pacman.x) + pacman.nextDx;
                let nextY = Math.round(pacman.y) + pacman.nextDy;
                if (grid[nextY] && grid[nextY][nextX] !== 1) {
                    pacman.dx = pacman.nextDx;
                    pacman.dy = pacman.nextDy;
                    pacman.nextDx = 0;
                    pacman.nextDy = 0;
                }
            }

            // Move Pacman
            if (pacman.x % 1 === 0 && pacman.y % 1 === 0) {
                let nextX = pacman.x + pacman.dx;
                let nextY = pacman.y + pacman.dy;
                if (!grid[nextY] || grid[nextY][nextX] === 1) {
                    pacman.dx = 0; pacman.dy = 0;
                }
            }
            
            pacman.x += pacman.dx * 0.1;
            pacman.y += pacman.dy * 0.1;

            // Eat Pellets
            let cx = Math.round(pacman.x);
            let cy = Math.round(pacman.y);
            if (grid[cy] && grid[cy][cx] === 2) {
                grid[cy][cx] = 0;
                score += 10;
                scoreEl.innerText = score;
            } else if (grid[cy] && grid[cy][cx] === 3) {
                grid[cy][cx] = 0;
                score += 50;
                scoreEl.innerText = score;
            }

            // Simple Ghost AI
            ghosts.forEach(g => {
                if (g.x % 1 === 0 && g.y % 1 === 0) {
                    let possible = [];
                    [[0,-1],[0,1],[-1,0],[1,0]].forEach(dir => {
                        if (grid[g.y+dir[1]] && grid[g.y+dir[1]][g.x+dir[0]] !== 1) {
                            possible.push(dir);
                        }
                    });
                    // Don't reverse
                    let forward = possible.filter(d => !(d[0] === -g.dx && d[1] === -g.dy));
                    if (forward.length > 0) possible = forward;
                    
                    if (possible.length > 0) {
                        let dir = possible[Math.floor(Math.random() * possible.length)];
                        g.dx = dir[0]; g.dy = dir[1];
                    } else {
                        g.dx = 0; g.dy = 0;
                    }
                }
                g.x += g.dx * 0.05;
                g.y += g.dy * 0.05;
            });
        }

        // Game Loop
        setInterval(() => {
            update();
            draw();
        }, 1000 / 60); // 60 FPS
    </script>
</body>
</html>
