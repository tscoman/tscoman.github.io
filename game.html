<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEE-AI PACKETMAN</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-wrapper {
            background: #0d0d0d;
            border: 1px solid #151515;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #888;
        }
        .score { color: #ffdf00; font-weight: bold; }
        canvas {
            background: #000;
            border-radius: 4px;
            display: block;
        }
        .controls { margin-top: 1rem; color: #666; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <span>ZEE-AI_PACKETMAN.EXE</span>
            <span>SCORE: <span class="score" id="score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="360" tabindex="1"></canvas>
        <div class="controls">Click the game & Use Arrow Keys / WASD to move</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const tileSize = 20;
        // 20x18 grid
        const map = [
            "####################",
            "#........#.........#",
            "#.##.###.#.###.##.#",
            "#o##.###.#.###.##o#",
            "#.................#",
            "#.##.#.#####.#.##.#",
            "#....#...#...#....#",
            "####.### # ###.####",
            "   #.#       #.#   ",
            "####.# ##-## #.####",
            "#......#   #......#",
            "#.##.#.#####.#.##.#",
            "#o.#...........#.o#",
            "##.#.#.#####.#.#.##",
            "#....#...#...#....#",
            "#.######.#.######.#",
            "#.................#",
            "####################"
        ];

        let grid = [];
        let score = 0;
        let pacman = { x: 9, y: 13, dx: 0, dy: 0, nextDx: 0, nextDy: 0, angle: 0, mouth: 0, mouthDir: 1 };
        let ghosts = [
            { x: 9, y: 8, dx: 0, dy: 0, color: '#ff0000' },
            { x: 10, y: 8, dx: 0, dy: 0, color: '#ffb8ff' },
            { x: 9, y: 7, dx: 0, dy: 0, color: '#00ffff' }
        ];

        // Word definitions for the pellets
        const words = ["GOOGLE", "KAGGLE", "AWS", "ML", "GCP", "DEV"];
        const wordColors = ["#4285F4", "#20BEFF", "#FF9900", "#FF00FF", "#00FF00", "#FF5555"];
        let wordIndex = 0;

        // Parse map
        for (let r = 0; r < map.length; r++) {
            let row = [];
            for (let c = 0; c < map[r].length; c++) {
                let char = map[r][c];
                if (char === '#') row.push(1);
                else if (char === '.') {
                    if (c % 6 === 0) {
                        row.push({ type: 2, word: words[wordIndex], color: wordColors[wordIndex], charIndex: 0 });
                        wordIndex = (wordIndex + 1) % words.length;
                    } else {
                        let prev = row[row.length - 1];
                        if (prev && typeof prev === 'object' && prev.type === 2 && prev.charIndex < prev.word.length - 1) {
                            row.push({ type: 2, word: prev.word, color: prev.color, charIndex: prev.charIndex + 1 });
                        } else {
                            row.push(2);
                        }
                    }
                }
                else if (char === 'o') row.push(3);
                else row.push(0);
            }
            row.push(1);
            grid.push(row);
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowUp' || e.key === 'w') { pacman.nextDx = 0; pacman.nextDy = -1; pacman.angle = -Math.PI/2; }
            if (e.key === 'ArrowDown' || e.key === 's') { pacman.nextDx = 0; pacman.nextDy = 1; pacman.angle = Math.PI/2; }
            if (e.key === 'ArrowLeft' || e.key === 'a') { pacman.nextDx = -1; pacman.nextDy = 0; pacman.angle = Math.PI; }
            if (e.key === 'ArrowRight' || e.key === 'd') { pacman.nextDx = 1; pacman.nextDy = 0; pacman.angle = 0; }
        });

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    let val = grid[r][c];
                    let x = c * tileSize;
                    let y = r * tileSize;
                    
                    if (val === 1) {
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.strokeStyle = '#333';
                        ctx.strokeRect(x, y, tileSize, tileSize);
                    } else if (val === 3) {
                        ctx.fillStyle = '#ffdf00';
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, 6, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (val && typeof val === 'object' && val.type === 2) {
                        ctx.fillStyle = val.color;
                        ctx.font = "bold 12px monospace";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        let letter = val.word[val.charIndex];
                        ctx.fillText(letter, x + tileSize/2, y + tileSize/2);
                    } else if (val === 2) {
                        ctx.fillStyle = '#666';
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ctx.save();
            ctx.translate(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2);
            ctx.rotate(pacman.angle);
            ctx.fillStyle = '#ffdf00';
            ctx.beginPath();
            pacman.mouth += 0.15 * pacman.mouthDir;
            if (pacman.mouth > 1 || pacman.mouth < 0) pacman.mouthDir *= -1;
            let mouthAngle = pacman.mouth * 0.6;
            ctx.arc(0, 0, tileSize/2 - 1, mouthAngle, Math.PI * 2 - mouthAngle);
            ctx.lineTo(0, 0);
            ctx.fill();
            ctx.restore();

            ghosts.forEach(g => {
                ctx.save();
                ctx.translate(g.x * tileSize + tileSize/2, g.y * tileSize + tileSize/2);
                ctx.fillStyle = g.color;
                ctx.beginPath();
                ctx.arc(0, -2, tileSize/2 - 2, Math.PI, 0);
                ctx.lineTo(tileSize/2 - 2, tileSize/2 - 2);
                for(let i=0; i<3; i++) {
                    ctx.lineTo(tileSize/2 - 2 - (i*4+2), tileSize/2 - 4);
                    ctx.lineTo(tileSize/2 - 2 - (i*4+4), tileSize/2 - 2);
                }
                ctx.lineTo(-(tileSize/2 - 2), tileSize/2 - 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-3, -2, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(3, -2, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-3, -2, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(3, -2, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });
        }

        function update() {
            if (pacman.nextDx !== 0 || pacman.nextDy !== 0) {
                let nextX = Math.round(pacman.x) + pacman.nextDx;
                let nextY = Math.round(pacman.y) + pacman.nextDy;
                if (grid[nextY] && grid[nextY][nextX] !== 1) {
                    pacman.dx = pacman.nextDx;
                    pacman.dy = pacman.nextDy;
                    pacman.nextDx = 0;
                    pacman.nextDy = 0;
                }
            }

            let isCentered = Math.abs(pacman.x - Math.round(pacman.x)) < 0.01 && Math.abs(pacman.y - Math.round(pacman.y)) < 0.01;
            if (isCentered) {
                pacman.x = Math.round(pacman.x);
                pacman.y = Math.round(pacman.y);
                let nextX = pacman.x + pacman.dx;
                let nextY = pacman.y + pacman.dy;
                if (!grid[nextY] || grid[nextY][nextX] === 1) {
                    pacman.dx = 0; pacman.dy = 0;
                }
            }
            
            pacman.x += pacman.dx * 0.2;
            pacman.y += pacman.dy * 0.2;

            let cx = Math.round(pacman.x);
            let cy = Math.round(pacman.y);
            if (grid[cy] && grid[cy][cx] !== 1 && grid[cy][cx] !== 0) {
                if (grid[cy][cx] === 2 || (grid[cy][cx] && grid[cy][cx].type === 2)) {
                    score += 10;
                } else if (grid[cy][cx] === 3) {
                    score += 50;
                }
                grid[cy][cx] = 0;
                scoreEl.innerText = score;
            }

            ghosts.forEach(g => {
                if (Math.abs(g.x - Math.round(g.x)) < 0.01 && Math.abs(g.y - Math.round(g.y)) < 0.01) {
                    g.x = Math.round(g.x); g.y = Math.round(g.y);
                    let possible = [];
                    [[0,-1],[0,1],[-1,0],[1,0]].forEach(dir => {
                        if (grid[g.y+dir[1]] && grid[g.y+dir[1]][g.x+dir[0]] !== 1) {
                            possible.push(dir);
                        }
                    });
                    let forward = possible.filter(d => !(d[0] === -g.dx && d[1] === -g.dy));
                    if (forward.length > 0) possible = forward;
                    
                    if (possible.length > 0) {
                        let dir = possible[Math.floor(Math.random() * possible.length)];
                        g.dx = dir[0]; g.dy = dir[1];
                    } else {
                        g.dx = 0; g.dy = 0;
                    }
                }
                g.x += g.dx * 0.1;
                g.y += g.dy * 0.1;
            });
        }

        setInterval(() => {
            update();
            draw();
        }, 1000 / 60);
    </script>
</body>
</html>
